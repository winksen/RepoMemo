# RepoMemo for a team, in containers (roadmap O7).
#
#   cp .env.example .env     # then fill in the secrets and the host name
#   docker compose up -d
#
# Open https://<REPOMEMO_HOST> and follow the first-run setup. The data lives
# in the `repomemo-data` volume; back it up from System > Backups, as in the
# production guide (mindmap/technical/operations.md, "Running it in containers").
#
# The server runs with a read-only root, as user 10001 and with no capability once it has started (its entrypoint
# starts as root only to give a volume that belongs to someone else to that user), and no way to gain any. Layout-accurate
# Office previews run in the `converter` container, which has no network and sees only the previews
# volume: turn them on with COMPOSE_PROFILES=previews and REPOMEMO_OFFICE_PREVIEWS=true in .env.

name: repomemo

services:
  server:
    build:
      context: .
      target: server
      args:
        REPOMEMO_BUILD_COMMIT: ${REPOMEMO_BUILD_COMMIT:-unknown}
        REPOMEMO_BUILD_DATE: ${REPOMEMO_BUILD_DATE:-unknown}
        REPOMEMO_IMAGE_TAG: ${REPOMEMO_VERSION:-local}
    image: repomemo-server:${REPOMEMO_VERSION:-local}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    # Starts as root only to fix the ownership of a volume and drop to user 10001 (docker/entrypoint.sh): the few
    # capabilities that takes, and nothing else; the server itself keeps none.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    environment:
      REPOMEMO_SERVER_ADDR: 0.0.0.0:3020
      REPOMEMO_SERVER_DATA_DIR: main
      # The address people use; it turns on HSTS and secure cookies.
      REPOMEMO_PUBLIC_URL: https://${REPOMEMO_HOST:-localhost}
      REPOMEMO_ALLOWED_ORIGIN: https://${REPOMEMO_HOST:-localhost}
      # Only the proxy container is believed about client addresses.
      REPOMEMO_TRUST_PROXY: "true"
      REPOMEMO_TRUSTED_PROXIES: 172.29.0.2
      REPOMEMO_JWT_SECRET: ${REPOMEMO_JWT_SECRET:?Set REPOMEMO_JWT_SECRET in .env (32 or more random characters)}
      REPOMEMO_SECRET_KEY: ${REPOMEMO_SECRET_KEY:?Set REPOMEMO_SECRET_KEY in .env (32 or more random characters)}
      REPOMEMO_SETUP_CODE: ${REPOMEMO_SETUP_CODE:-}
      REPOMEMO_SYSTEM_ADMIN_EMAILS: ${REPOMEMO_SYSTEM_ADMIN_EMAILS:-}
      REPOMEMO_BACKUP_INTERVAL_HOURS: ${REPOMEMO_BACKUP_INTERVAL_HOURS:-24}
      REPOMEMO_BACKUP_KEY: ${REPOMEMO_BACKUP_KEY:-}
      REPOMEMO_BACKUP_KEY_PREVIOUS: ${REPOMEMO_BACKUP_KEY_PREVIOUS:-}
      REPOMEMO_OFFICE_PREVIEWS: ${REPOMEMO_OFFICE_PREVIEWS:-false}
      # Where LibreOffice runs when previews are on: the converter container, through its socket.
      REPOMEMO_PREVIEW_ROOT: /var/lib/repomemo-previews
      REPOMEMO_SOFFICE: soffice
      REPOMEMO_SOFFICE_WRAPPER: /usr/local/bin/repomemo-soffice-wrapper
    volumes:
      - repomemo-data:/var/lib/repomemo
      - repomemo-previews:/var/lib/repomemo-previews
      - soffice-socket:/run/soffice
    networks:
      repomemo:
        ipv4_address: 172.29.0.3

  # LibreOffice for layout-accurate previews, only with COMPOSE_PROFILES=previews. No network, a read-only
  # root, no capabilities, and a view of nothing but the previews volume and the socket it answers on.
  converter:
    profiles:
      - previews
    build:
      context: .
      target: converter
      args:
        REPOMEMO_BUILD_COMMIT: ${REPOMEMO_BUILD_COMMIT:-unknown}
        REPOMEMO_BUILD_DATE: ${REPOMEMO_BUILD_DATE:-unknown}
        REPOMEMO_IMAGE_TAG: ${REPOMEMO_VERSION:-local}
    # Built here by default; REPOMEMO_CONVERTER_IMAGE starts a converter image of its own instead (V0.4.12).
    image: ${REPOMEMO_CONVERTER_IMAGE:-repomemo-converter:${REPOMEMO_VERSION:-local}}
    restart: unless-stopped
    init: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - repomemo-previews:/var/lib/repomemo-previews
      - soffice-socket:/run/soffice

  proxy:
    build:
      context: .
      target: proxy
      args:
        REPOMEMO_BUILD_COMMIT: ${REPOMEMO_BUILD_COMMIT:-unknown}
        REPOMEMO_BUILD_DATE: ${REPOMEMO_BUILD_DATE:-unknown}
        REPOMEMO_IMAGE_TAG: ${REPOMEMO_VERSION:-local}
    image: repomemo-proxy:${REPOMEMO_VERSION:-local}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      REPOMEMO_HOST: ${REPOMEMO_HOST:-localhost}
      # What the web app is told when it starts (/config.json): the API's address (empty: this host) and the name
      # shown in the browser's tab. No quote or backslash in either.
      REPOMEMO_WEB_API_URL: ${REPOMEMO_WEB_API_URL:-}
      REPOMEMO_PRODUCT_NAME: ${REPOMEMO_PRODUCT_NAME:-RepoMemo}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      repomemo:
        ipv4_address: 172.29.0.2

networks:
  repomemo:
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  repomemo-data:
  repomemo-previews:
  soffice-socket:
  caddy-data:
  caddy-config:
