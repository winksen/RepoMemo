# RepoMemo for a team, in containers (roadmap O7).
#
#   cp .env.example .env     # then fill in the secrets and the host name; it asks for the edge (TLS) profile
#   docker compose up -d
#
# Open https://<REPOMEMO_HOST> and follow the first-run setup. The data lives in three volumes (the database, the stored
# files, the backups) and `repomemo-data` (the key file and the logs); a 0.3.x install moves its single volume into them
# with deploy/migrate-volumes.sh. Back it up from System > Backups, as in the
# production guide (mindmap/technical/operations.md, "Running it in containers").
#
# The server runs with a read-only root, as user 10001 and with no capability once it has started (its entrypoint
# starts as root only to give a volume that belongs to someone else to that user), and no way to gain any. Layout-accurate
# Office previews run in the `converter` container, which has no network and sees only the previews
# volume: turn them on with COMPOSE_PROFILES=previews and REPOMEMO_OFFICE_PREVIEWS=true in .env.

name: repomemo

# Logs go to Docker's json-file driver with rotation, so a container's log never fills the disk (V0.4.28): five files of
# ten megabytes each per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Memory and CPU are not limited here because the right figures depend on the machine and the data. Sizing guidance,
# and the lines to add under a service, are in mindmap/technical/operations.md ("Sizing and limits"), for example:
#   deploy:
#     resources:
#       limits: { memory: 2g, cpus: "2" }

services:
  server:
    build:
      context: .
      target: server
      args:
        REPOMEMO_BUILD_COMMIT: ${REPOMEMO_BUILD_COMMIT:-unknown}
        REPOMEMO_BUILD_DATE: ${REPOMEMO_BUILD_DATE:-unknown}
        REPOMEMO_IMAGE_TAG: ${REPOMEMO_VERSION:-local}
    image: repomemo-server:${REPOMEMO_VERSION:-local}
    restart: unless-stopped
    stop_grace_period: 45s
    logging: *logging
    init: true
    read_only: true
    tmpfs:
      - /tmp
    # Starts as root only to fix the ownership of a volume and drop to user 10001 (docker/entrypoint.sh): the few
    # capabilities that takes, and nothing else; the server itself keeps none.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    environment:
      REPOMEMO_SERVER_ADDR: 0.0.0.0:3020
      REPOMEMO_SERVER_DATA_DIR: main
      # Logs are one JSON object per line on standard output, for Docker's log driver and any collector (V0.4.29); no
      # log files in the container. Audit events carry "target":"audit", so a collector can keep them apart.
      REPOMEMO_LOG_FORMAT: json
      REPOMEMO_LOG_TO_FILE: "false"
      # The database, the stored files and the backups sit in volumes of their own (V0.4.22); the key file, the logs and
      # the previews stay in repomemo-data.
      REPOMEMO_DB_DIR: /var/lib/repomemo-db
      REPOMEMO_BLOB_DIR: /var/lib/repomemo-files
      REPOMEMO_BACKUP_DIR: /var/lib/repomemo-backups
      # The address people use; it turns on HSTS and secure cookies.
      REPOMEMO_PUBLIC_URL: https://${REPOMEMO_HOST:-localhost}
      REPOMEMO_ALLOWED_ORIGIN: https://${REPOMEMO_HOST:-localhost}
      # Only the edge and the web container are believed about client addresses.
      REPOMEMO_TRUST_PROXY: "true"
      REPOMEMO_TRUSTED_PROXIES: 172.29.0.2,172.29.0.4
      REPOMEMO_JWT_SECRET: ${REPOMEMO_JWT_SECRET:?Set REPOMEMO_JWT_SECRET in .env (32 or more random characters)}
      REPOMEMO_SECRET_KEY: ${REPOMEMO_SECRET_KEY:?Set REPOMEMO_SECRET_KEY in .env (32 or more random characters)}
      REPOMEMO_SETUP_CODE: ${REPOMEMO_SETUP_CODE:-}
      REPOMEMO_SYSTEM_ADMIN_EMAILS: ${REPOMEMO_SYSTEM_ADMIN_EMAILS:-}
      REPOMEMO_BACKUP_INTERVAL_HOURS: ${REPOMEMO_BACKUP_INTERVAL_HOURS:-24}
      REPOMEMO_BACKUP_KEY: ${REPOMEMO_BACKUP_KEY:-}
      REPOMEMO_BACKUP_KEY_PREVIOUS: ${REPOMEMO_BACKUP_KEY_PREVIOUS:-}
      REPOMEMO_OFFICE_PREVIEWS: ${REPOMEMO_OFFICE_PREVIEWS:-false}
      # Where LibreOffice runs when previews are on: the converter container, through its socket.
      REPOMEMO_PREVIEW_ROOT: /var/lib/repomemo-previews
      REPOMEMO_SOFFICE: soffice
      REPOMEMO_SOFFICE_WRAPPER: /usr/local/bin/repomemo-soffice-wrapper
    volumes:
      - repomemo-data:/var/lib/repomemo
      - repomemo-db:/var/lib/repomemo-db
      - repomemo-files:/var/lib/repomemo-files
      - repomemo-backups:/var/lib/repomemo-backups
      - repomemo-previews:/var/lib/repomemo-previews
      - soffice-socket:/run/soffice
    networks:
      repomemo:
        ipv4_address: 172.29.0.3

  # LibreOffice for layout-accurate previews, only with COMPOSE_PROFILES=previews. No network, a read-only
  # root, no capabilities, and a view of nothing but the previews volume and the socket it answers on.
  converter:
    profiles:
      - previews
    build:
      context: .
      target: converter
      args:
        REPOMEMO_BUILD_COMMIT: ${REPOMEMO_BUILD_COMMIT:-unknown}
        REPOMEMO_BUILD_DATE: ${REPOMEMO_BUILD_DATE:-unknown}
        REPOMEMO_IMAGE_TAG: ${REPOMEMO_VERSION:-local}
    # Built here by default; REPOMEMO_CONVERTER_IMAGE starts a converter image of its own instead (V0.4.12).
    image: ${REPOMEMO_CONVERTER_IMAGE:-repomemo-converter:${REPOMEMO_VERSION:-local}}
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *logging
    # The listener has opened its socket on the volume it shares with the server.
    healthcheck:
      test: ["CMD", "test", "-S", "/run/soffice/convert.sock"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    init: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - repomemo-previews:/var/lib/repomemo-previews
      - soffice-socket:/run/soffice

  # The web client over plain HTTP (V0.4.18): the app, /config.json, and /v1 and /health forwarded to the server. It
  # publishes its port on this machine's loopback only; behind your own proxy, point that at it. TLS is the edge's.
  web:
    build:
      context: .
      target: webapp
      args:
        REPOMEMO_BUILD_COMMIT: ${REPOMEMO_BUILD_COMMIT:-unknown}
        REPOMEMO_BUILD_DATE: ${REPOMEMO_BUILD_DATE:-unknown}
        REPOMEMO_IMAGE_TAG: ${REPOMEMO_VERSION:-local}
    image: repomemo-web:${REPOMEMO_VERSION:-local}
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *logging
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      server:
        condition: service_healthy
    environment:
      REPOMEMO_API_UPSTREAM: server:3020
      # What the web app is told when it starts (/config.json): the API's address (empty: this host) and the name
      # shown in the browser's tab. No quote or backslash in either.
      REPOMEMO_WEB_API_URL: ${REPOMEMO_WEB_API_URL:-}
      REPOMEMO_PRODUCT_NAME: ${REPOMEMO_PRODUCT_NAME:-RepoMemo}
    ports:
      - "127.0.0.1:${REPOMEMO_WEB_PORT:-8080}:8080"
    networks:
      repomemo:
        ipv4_address: 172.29.0.4

  # TLS in front of the web image, only with COMPOSE_PROFILES=edge: a certificate for a public name, Caddy's own for
  # localhost, or the ones in REPOMEMO_TLS_DIR (tls.crt and tls.key). Leave it out behind a proxy of your own.
  edge:
    profiles:
      - edge
    build:
      context: .
      target: edge
      args:
        REPOMEMO_BUILD_COMMIT: ${REPOMEMO_BUILD_COMMIT:-unknown}
        REPOMEMO_BUILD_DATE: ${REPOMEMO_BUILD_DATE:-unknown}
        REPOMEMO_IMAGE_TAG: ${REPOMEMO_VERSION:-local}
    image: repomemo-edge:${REPOMEMO_VERSION:-local}
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *logging
    # Caddy has no health route of its own with its admin endpoint off: something must be listening on port 443 (read
    # from /proc/net, since the image has no tool for it).
    healthcheck:
      test: ["CMD-SHELL", "grep -Eqi ':01BB [0-9A-F:]+ 0A ' /proc/net/tcp /proc/net/tcp6"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
    environment:
      REPOMEMO_HOST: ${REPOMEMO_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ${REPOMEMO_TLS_DIR:-./deploy/certs}:/certs:ro
    networks:
      repomemo:
        ipv4_address: 172.29.0.2

networks:
  repomemo:
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  repomemo-data:
  repomemo-db:
  repomemo-files:
  repomemo-backups:
  repomemo-previews:
  soffice-socket:
  caddy-data:
  caddy-config:
