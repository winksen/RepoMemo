# The images on the registry (V0.4.37): on a v* tag the checks run, then the four images (server, converter, edge, web) are
# built natively for amd64 and arm64 and pushed to GHCR as X.Y.Z, X.Y and latest. A pull request or a push to a branch
# publishes nothing; a manual run builds everything and pushes nothing.
# Provenance (V0.4.38): each joined image gets a signed build attestation and a signed SBOM (SPDX), both kept with the image
# on the registry and verifiable with `gh attestation verify` (docs/VERIFYING_IMAGES.md).
name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  release-tests:
    name: Release tests
    uses: ./.github/workflows/release-tests.yml

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: node scripts/set-version.mjs --check
      - run: node scripts/check-container.mjs
      - run: node scripts/check-migrations.mjs
      - run: node scripts/check-docs.mjs
      - run: node scripts/check-templates.mjs

  build:
    name: ${{ matrix.image.name }} ${{ matrix.arch.name }}
    needs: [checks, release-tests]
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: amd64, runner: ubuntu-latest }
          - { name: arm64, runner: ubuntu-24.04-arm }
        image:
          - { name: server, target: server }
          - { name: converter, target: converter }
          - { name: edge, target: edge }
          - { name: web, target: webapp }
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build it (and, on a tag, push it under a tag of its own architecture)
        env:
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          reference="${REGISTRY}/${owner}/repomemo-${{ matrix.image.name }}:${version}-${{ matrix.arch.name }}"
          docker build --target "${{ matrix.image.target }}" \
            --build-arg "REPOMEMO_BUILD_COMMIT=${GITHUB_SHA}" \
            --build-arg "REPOMEMO_BUILD_DATE=$(git log -1 --format=%cI)" \
            --build-arg "REPOMEMO_IMAGE_TAG=${version}" \
            --tag "${reference}" .
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            printf '%s' "${REGISTRY_TOKEN}" | docker login "${REGISTRY}" --username "${GITHUB_ACTOR_NAME}" --password-stdin
            docker push "${reference}"
          fi
      - name: Build evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### ${{ matrix.image.name }} ${{ matrix.arch.name }}: ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${GITHUB_SHA}; ref: ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.ID}}' | grep "repomemo-${{ matrix.image.name }}" >> "$GITHUB_STEP_SUMMARY" || echo "Image unavailable" >> "$GITHUB_STEP_SUMMARY"

  manifest:
    name: ${{ matrix.image }} tags
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        image: [server, converter, edge, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: One name for both architectures, under X.Y.Z, X.Y and latest
        env:
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          minor="${version%.*}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          name="${REGISTRY}/${owner}/repomemo-${{ matrix.image }}"
          printf '%s' "${REGISTRY_TOKEN}" | docker login "${REGISTRY}" --username "${GITHUB_ACTOR_NAME}" --password-stdin
          docker buildx imagetools create \
            --tag "${name}:${version}" --tag "${name}:${minor}" --tag "${name}:latest" \
            "${name}:${version}-amd64" "${name}:${version}-arm64"
          docker buildx imagetools inspect "${name}:${version}" | tee inspect.txt
          grep -q "linux/amd64" inspect.txt
          grep -q "linux/arm64" inspect.txt
          echo "digest=$(docker buildx imagetools inspect "${name}:${version}" --format '{{ .Manifest.Digest }}')" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
        id: joined
      - name: The SBOM (SPDX), read from the pushed image
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm --env TRIVY_USERNAME --env TRIVY_PASSWORD \
            --volume "$PWD:/work" --workdir /work \
            "$TRIVY_IMAGE" image --format spdx-json --output /work/sbom.spdx.json \
            "${{ steps.joined.outputs.name }}@${{ steps.joined.outputs.digest }}"
          test -s sbom.spdx.json
      - name: Sign the build attestation (keyless) and keep it with the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.joined.outputs.name }}
          subject-digest: ${{ steps.joined.outputs.digest }}
          push-to-registry: true
      - name: Sign the SBOM (keyless) and keep it with the image
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.joined.outputs.name }}
          subject-digest: ${{ steps.joined.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
