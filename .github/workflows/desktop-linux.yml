# The desktop app for Linux (V0.4.59): an AppImage and a .deb for x86-64, built on Ubuntu 22.04 (the oldest glibc and WebKitGTK 4.1 a
# current Ubuntu or Debian still has, so the AppImage runs on newer systems), tried once on a display of its own, and kept as one
# artifact. Nothing is published. The same preset address and configuration file work as on Windows.
name: Desktop Linux

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: The system libraries the build needs (and xvfb to open the app on a display of its own)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file patchelf libssl-dev libgtk-3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev xdg-utils xvfb xdotool dbus-x11
      - run: npm ci
      - name: Build the app, the AppImage and the .deb
        working-directory: apps/desktop
        run: npx tauri build --bundles appimage,deb
      - name: Keep the files
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist-desktop-ci
          cp target/release/bundle/appimage/RepoMemo_${version}_amd64.AppImage dist-desktop-ci/
          cp target/release/bundle/deb/RepoMemo_${version}_amd64.deb dist-desktop-ci/
          cp target/release/repomemo-desktop dist-desktop-ci/repomemo-desktop
          (cd dist-desktop-ci && sha256sum * | sort -k2 > SHA256SUMS && cat SHA256SUMS)
      - name: The package says what it is and what it needs
        run: |
          deb="$(ls dist-desktop-ci/*.deb)"
          dpkg-deb --info "$deb" | tee deb-info.txt
          grep -q "Package: repomemo" deb-info.txt
          grep -q "xdg-utils" deb-info.txt
          grep -q "libwebkit2gtk-4.1" deb-info.txt
          dpkg-deb --contents "$deb" | grep -q "usr/share/applications/RepoMemo.desktop"
          dpkg-deb --fsys-tarfile "$deb" | tar -xO ./usr/share/applications/RepoMemo.desktop | grep -q "x-scheme-handler/repomemo"
      - name: The AppImage opens the app (a display of its own, no installation)
        run: |
          appimage="$(ls dist-desktop-ci/*.AppImage)"
          chmod +x "$appimage"
          export APPIMAGE_EXTRACT_AND_RUN=1
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" bash -c '
            "$0" &
            pid=$!
            sleep 30
            kill -0 "$pid" || { echo "the app exited"; exit 1; }
            xdotool search --name "^RepoMemo$" | head -1 | grep -q . || { echo "no window titled RepoMemo"; kill "$pid"; exit 1; }
            kill "$pid"
          ' "$appimage"
      - name: The .deb installs and opens the app
        run: |
          sudo apt-get install -y "./$(ls dist-desktop-ci/*.deb)"
          command -v repomemo-desktop
          xvfb-run --auto-servernum bash -c '
            repomemo-desktop &
            pid=$!
            sleep 30
            kill -0 "$pid" || { echo "the installed app exited"; exit 1; }
            kill "$pid"
          '
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: desktop-linux-x64
          path: dist-desktop-ci/*
          if-no-files-found: error
