# The desktop app for Windows (V0.4.49): the per-person installer, an installer that carries the WebView2 runtime for machines with no
# internet, and the portable executable, built on a Windows runner and kept as one artifact. The app is started once to see that it
# opens. Nothing is published: the artifact is what an administrator hands a team (scripts/package-desktop.mjs --from).
name: Desktop Windows

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/package-desktop.mjs"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Code signing (V0.4.57) happens only when the repository has a certificate; the certificate itself is read by the one step that signs.
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      # Updates (V0.4.56) are signed only when the repository has the signing key; the app carries the matching public key.
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      REPOMEMO_UPDATE_PUBKEY: ${{ vars.REPOMEMO_UPDATE_PUBKEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - name: Import the signing certificate (only when the repository has one)
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:/CurrentUser/My -Password $password
          Remove-Item $pfx
          @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } | ConvertTo-Json -Depth 5 | Set-Content apps/desktop/src-tauri/tauri.signing.conf.json
      - name: Build the app and the per-person installer (WebView2 is fetched when it is missing)
        working-directory: apps/desktop
        shell: pwsh
        # The update signing key is given to this step alone (V0.4.65): not to `npm ci`, whose install scripts run code of other people.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $extra = @()
          if ($env:HAS_SIGNING_KEY -eq 'true') { $extra += @('--config', 'src-tauri/tauri.updater.conf.json') }
          if ($env:HAS_WINDOWS_CERT -eq 'true') { $extra += @('--config', 'src-tauri/tauri.signing.conf.json') }
          npx tauri build --bundles nsis @extra
      - name: Keep the portable executable and the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-desktop-ci | Out-Null
          $version = node -p "require('./package.json').version"
          Copy-Item target/release/repomemo-desktop.exe dist-desktop-ci/repomemo-desktop.exe
          Copy-Item "target/release/bundle/nsis/RepoMemo_${version}_x64-setup.exe" "dist-desktop-ci/RepoMemo_${version}_x64-setup.exe"
          # The installer's signature, for the update feed, when the signing key was given.
          if ($env:HAS_SIGNING_KEY -eq 'true') { Copy-Item "target/release/bundle/nsis/RepoMemo_${version}_x64-setup.exe.sig" "dist-desktop-ci/RepoMemo_${version}_x64-setup.exe.sig" }
      - name: The executable says what it is
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $info = (Get-Item dist-desktop-ci/repomemo-desktop.exe).VersionInfo
          if ($info.ProductName -ne "RepoMemo") { throw "the product is '$($info.ProductName)', not RepoMemo" }
          if (-not $info.FileVersion.StartsWith($version)) { throw "the file version is '$($info.FileVersion)', not $version" }
          if (-not $info.FileDescription) { throw "the executable has no description" }
          $info | Format-List ProductName, ProductVersion, FileVersion, FileDescription, CompanyName, LegalCopyright
      - name: Build the installer that carries WebView2 (for machines with no internet)
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $extra = @()
          if ($env:HAS_WINDOWS_CERT -eq 'true') { $extra += @('--config', 'src-tauri/tauri.signing.conf.json') }
          npx tauri build --bundles nsis --config src-tauri/tauri.offline.conf.json @extra
      - name: Keep it under a name of its own
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Copy-Item "target/release/bundle/nsis/RepoMemo_${version}_x64-setup.exe" "dist-desktop-ci/RepoMemo_${version}_x64-offline.exe"
          Get-ChildItem dist-desktop-ci | Format-Table Name, Length
      - name: The signatures (signed by the certificate when there is one, said plainly when there is not)
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem dist-desktop-ci -Filter *.exe) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($env:HAS_WINDOWS_CERT -eq 'true') {
              if ($signature.Status -ne 'Valid') { throw "$($file.Name) is not validly signed: $($signature.Status)" }
              if (-not $signature.TimeStamperCertificate) { throw "$($file.Name) carries no timestamp, so its signature would end with the certificate" }
              Write-Host "$($file.Name): signed by $($signature.SignerCertificate.Subject)"
            } else {
              Write-Host "::notice::$($file.Name) is not signed (the repository has no WINDOWS_CERTIFICATE secret); Windows SmartScreen warns the first time it is run"
            }
          }
      - name: The app opens
        shell: pwsh
        run: |
          $app = Start-Process -FilePath dist-desktop-ci/repomemo-desktop.exe -PassThru
          Start-Sleep -Seconds 25
          if ($app.HasExited) { throw "the app exited with code $($app.ExitCode)" }
          $app.Refresh()
          if ($app.MainWindowTitle -ne "RepoMemo") { throw "the window is titled '$($app.MainWindowTitle)', not RepoMemo" }
          # A second start brings the first to the front and ends.
          $second = Start-Process -FilePath dist-desktop-ci/repomemo-desktop.exe -PassThru
          if (-not $second.WaitForExit(30000)) { Stop-Process -Id $second.Id -Force; throw "a second copy of the app stayed open" }
          if ($app.HasExited) { throw "the first copy ended when a second was started" }
          Stop-Process -Id $app.Id -Force
      - name: The installer installs for one person, silently, with a shortcut in the Start menu and on the desktop
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $setup = (Resolve-Path "dist-desktop-ci/RepoMemo_${version}_x64-setup.exe").Path
          $run = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "the installer exited with code $($run.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA "RepoMemo"
          $programs = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"
          $desktop = [Environment]::GetFolderPath("Desktop")
          foreach ($path in @((Join-Path $dir "uninstall.exe"), (Join-Path $programs "RepoMemo.lnk"), (Join-Path $desktop "RepoMemo.lnk"))) {
            if (-not (Test-Path $path)) { throw "the installer left no $path" }
          }
          if (-not (Get-ChildItem $dir -Filter *.exe | Where-Object Name -ne "uninstall.exe")) { throw "the installer left no program in $dir" }
          if (-not (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\RepoMemo")) { throw "the installation is not recorded for the person" }
          if (-not (Test-Path "HKCU:\Software\Classes\repomemo\shell\open\command")) { throw "the repomemo:// links are not registered for the person" }
          if (Test-Path "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\RepoMemo") { throw "the installation is recorded for the machine" }
      - name: The installed app opens
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "RepoMemo"
          $program = Get-ChildItem $dir -Filter *.exe | Where-Object Name -ne "uninstall.exe" | Select-Object -First 1
          $app = Start-Process -FilePath $program.FullName -PassThru
          Start-Sleep -Seconds 25
          if ($app.HasExited) { throw "the installed app exited with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
      - name: A silent removal takes the program and the shortcuts and keeps the person's saved sign-in
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "RepoMemo"
          $config = Join-Path $env:APPDATA "com.repomemo.desktop"
          New-Item -ItemType Directory -Force $config | Out-Null
          Set-Content -Path (Join-Path $config "server.json") -Value '{ "server_url": "https://memo.example.com" }'
          Start-Process -FilePath (Join-Path $dir "uninstall.exe") -ArgumentList "/S", "_?=$dir" -Wait
          if (Get-ChildItem $dir -Filter *.exe -ErrorAction SilentlyContinue | Where-Object Name -ne "uninstall.exe") { throw "the program is still in $dir" }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath("Desktop")) "RepoMemo.lnk")) { throw "the desktop shortcut is still there" }
          if (Test-Path (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\RepoMemo.lnk")) { throw "the Start menu entry is still there" }
          if (-not (Test-Path (Join-Path $config "server.json"))) { throw "a silent removal forgot the saved server" }
      - name: One SHA256SUMS
        shell: pwsh
        run: |
          Push-Location dist-desktop-ci
          Get-ChildItem -File | Where-Object Name -ne SHA256SUMS | Sort-Object Name | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii SHA256SUMS
          Get-Content SHA256SUMS
          Pop-Location
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: desktop-windows-x64
          path: dist-desktop-ci/*
          if-no-files-found: error

  # The update feed (V0.4.56): on a tag, and only when the repository has the signing key, the signed installer and a latest.json that
  # names it are attached to the release, which the app's updater reads. The only job here that writes, and it writes nothing else.
  publish-update:
    name: Publish the signed update
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') && vars.REPOMEMO_UPDATE_PUBKEY != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: desktop-windows-x64
          path: desktop
      - name: The feed, from the installer and its signature
        run: |
          version="$(node -p "require('./package.json').version")"
          test -s "desktop/RepoMemo_${version}_x64-setup.exe.sig" || { echo "the build was not signed (no signing key); no update is published"; exit 1; }
          node scripts/release-notes.mjs --version "$version" --repo "$GITHUB_REPOSITORY" > release-notes.md
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" node scripts/update-feed.mjs --version "$version" --notes release-notes.md --out latest.json             --platform windows-x86_64 --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/RepoMemo_${version}_x64-setup.exe"             --signature "desktop/RepoMemo_${version}_x64-setup.exe.sig"
          cat latest.json
      - name: Attach them (the release is made by the archives workflow; wait for it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break
            sleep 30
          done
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber             "desktop/RepoMemo_${version}_x64-setup.exe" "desktop/RepoMemo_${version}_x64-setup.exe.sig" latest.json
