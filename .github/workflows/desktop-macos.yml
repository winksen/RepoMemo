# The desktop app for macOS (V0.4.60): one universal .dmg (Apple silicon and Intel in one app) built on a macOS runner, signed and
# notarized when the repository has the Apple credentials, looked at, opened once and kept as an artifact. Nothing is published.
# The same preset address and configuration file work as on the other systems.
name: Desktop macOS

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  macos:
    name: macOS universal
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Signing and notarization (V0.4.60) happen only when the repository has the credentials; they are read by the build step alone.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_NOTARIZATION: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - name: Build the universal app and the .dmg (signed and notarized when the repository has the credentials)
        working-directory: apps/desktop
        env:
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          extra=""
          if [ "$HAS_APPLE_CERT" = "true" ]; then
            export APPLE_CERTIFICATE="$SECRET_APPLE_CERTIFICATE" APPLE_CERTIFICATE_PASSWORD="$SECRET_APPLE_CERTIFICATE_PASSWORD" APPLE_SIGNING_IDENTITY="$SECRET_APPLE_SIGNING_IDENTITY"
            if [ "$HAS_NOTARIZATION" = "true" ]; then
              export APPLE_ID="$SECRET_APPLE_ID" APPLE_PASSWORD="$SECRET_APPLE_PASSWORD" APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
            fi
          else
            # Without a certificate the app is signed ad hoc: an Apple-silicon Mac refuses to start a program with no signature at all.
            extra="--config src-tauri/tauri.adhoc.conf.json"
          fi
          npx tauri build --target universal-apple-darwin --bundles dmg $extra
      - name: Keep the .dmg
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist-desktop-ci
          cp "target/universal-apple-darwin/release/bundle/dmg/RepoMemo_${version}_universal.dmg" dist-desktop-ci/
          (cd dist-desktop-ci && shasum -a 256 * > SHA256SUMS && cat SHA256SUMS)
      - name: The app is one program for both kinds of Mac, says what it is and registers repomemo:// links
        run: |
          dmg="$(ls dist-desktop-ci/*.dmg)"
          mount="$(hdiutil attach "$dmg" -nobrowse -readonly | tail -1 | cut -f3)"
          app="$mount/RepoMemo.app"
          lipo -archs "$app/Contents/MacOS/repomemo-desktop" | tee archs.txt
          grep -q "x86_64" archs.txt && grep -q "arm64" archs.txt
          plutil -p "$app/Contents/Info.plist" | tee info.txt
          grep -q '"CFBundleIdentifier" => "com.repomemo.desktop"' info.txt
          grep -q "repomemo" info.txt
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ "$HAS_NOTARIZATION" = "true" ]; then
            spctl --assess --type execute --verbose "$app"
            xcrun stapler validate "$app"
          else
            echo "::notice::the app is not notarized (the repository has no Apple credentials); macOS Gatekeeper asks before it is first opened"
          fi
          hdiutil detach "$mount"
      - name: The app opens
        run: |
          dmg="$(ls dist-desktop-ci/*.dmg)"
          mount="$(hdiutil attach "$dmg" -nobrowse -readonly | tail -1 | cut -f3)"
          "$mount/RepoMemo.app/Contents/MacOS/repomemo-desktop" &
          pid=$!
          sleep 30
          kill -0 "$pid" || { echo "the app exited"; exit 1; }
          kill "$pid"
          hdiutil detach "$mount"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: desktop-macos-universal
          path: dist-desktop-ci/*
          if-no-files-found: error
