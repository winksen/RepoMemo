# Every push to main and every pull request (roadmap C8).
#
# Blocking: versions agree, workspace templates valid, released migrations unchanged, a 0.2.0 environment upgrades, Rust tests on Linux and Windows, the web type
# check, web tests, accessibility rules and generated types, rustfmt and clippy, and security
# advisories for the server's dependencies and the web client's production
# dependencies. The container is tried for real (V0.3.23): `docker compose up` starts the stack and
# `/health/ready` answers through the proxy, and the server and proxy images are built for arm64 on a
# native arm64 runner (nothing is published).
# Advisory (reported, not blocking): duplicate crate versions.
#
# Every action is pinned to a commit (the release it is, in the comment), and Dependabot proposes the next one
# (.github/dependabot.yml); `npm run container:check` refuses an action that names a tag or branch.
#
# The desktop crate (apps/desktop/src-tauri) is left out of the Rust jobs: it
# needs WebKit/GTK system libraries on Linux and is frozen as the local edition.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The compose file pulls the released images (V0.4.40); CI tries the code of this commit, so it builds them.
  COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml

jobs:
  versions:
    name: Versions agree
    runs-on: ubuntu-latest
    steps:
      # The whole history, so a changed template can be compared with the file before it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/set-version.mjs --check
      - name: Container files agree
        run: node scripts/check-container.mjs
      - name: Released migrations are unchanged
        run: node scripts/check-migrations.mjs
      - name: Documentation matches the code
        run: node scripts/check-docs.mjs
      - name: Templates are valid, and a changed one has a new version
        run: node scripts/check-templates.mjs --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: The template checker refuses what it should
        run: node --test scripts/check-templates.test.mjs
      - name: The release page is written from the changelog
        run: node --test scripts/release-notes.test.mjs
      - name: The pinning rules refuse what they should
        run: node --test scripts/pins.test.mjs
      - name: The desktop app is still the web client (nothing for the desktop alone is unlisted)
        run: node scripts/check-desktop.mjs
      - name: The parity check refuses what it should
        run: node --test scripts/check-desktop.test.mjs
      - name: The update feed refuses what is not signed
        run: node --test scripts/update-feed.test.mjs
      - name: The desktop packaging command checks what it is given
        run: node --test scripts/package-desktop.test.mjs

  web:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Generated types match the Rust domain crate
        run: npm run types:check
      - name: Stylesheets are small and imported in order
        run: npm run styles:check
      - name: Accessibility rules and colour contrast
        run: npm run a11y:check
      - name: Web client tests
        run: npm run test:web
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # The compose file as a person runs it (roadmap O7b, V0.3.23): the images are built, the stack is brought up with
  # throwaway secrets, the server must turn healthy and answer `/health/ready` through the proxy, which has
  # a certificate of its own for `localhost`.
  compose:
    name: docker compose up
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: A .env with throwaway secrets
        run: |
          {
            echo "REPOMEMO_HOST=localhost"
            echo "COMPOSE_PROFILES=edge"
            echo "REPOMEMO_SETUP_CODE=SMOKETEST2345"
            echo "REPOMEMO_JWT_SECRET=$(openssl rand -hex 32)"
            echo "REPOMEMO_SECRET_KEY=$(openssl rand -hex 32)"
          } > .env
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 900
      - name: The server answers ready through the proxy
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --insecure --resolve localhost:443:127.0.0.1 https://localhost/health/ready; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "/health/ready never answered" >&2
          exit 1
      - name: Every service is healthy, as --wait promised (V0.4.28)
        run: |
          docker compose ps --format '{{.Service}} {{.Health}}' | tee services.txt
          test "$(wc -l < services.txt)" -ge 3
          ! grep -v ' healthy$' services.txt
      - name: Every line the server wrote is JSON (V0.4.29)
        run: |
          docker compose logs --no-log-prefix --no-color server > server.log
          test -s server.log
          node -e '
            const lines = require("fs").readFileSync("server.log", "utf8").split("\n").filter(Boolean);
            const bad = lines.filter((line) => { try { const v = JSON.parse(line); return !(v.timestamp && v.level && v.target && "message" in v); } catch { return true; } });
            if (bad.length) { console.error(bad.length + " of " + lines.length + " lines are not log objects, first: " + bad[0]); process.exit(1); }
            console.log(lines.length + " lines, all JSON log objects");
          '
      - name: The first hour, through the proxy and the containers
        run: |
          # Setup, a workspace, an upload, indexing, search, a backup, an export and an import (V0.4.26). The checks of the
          # script itself pass or the job fails.
          REPOMEMO_SMOKE_SETUP_CODE=SMOKETEST2345 node scripts/smoke-test.mjs https://localhost
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
      - name: What the stack logged
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # The images are scanned (V0.4.13): the server, the converter and the proxy are built and read by Trivy, a container
  # pinned by digest, for known vulnerabilities in the operating system and in the Rust and npm packages they carry.
  # A high or critical finding that has a fix fails the job after all three are read; the reports are kept.
  # `.trivyignore` lists what is accepted, each with a reason.
  image-scan:
    name: Image scan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the three images
        run: |
          docker build --target server --tag repomemo-server:scan .
          docker build --target converter --tag repomemo-converter:scan .
          docker build --target edge --tag repomemo-edge:scan .
          docker build --target webapp --tag repomemo-web:scan .
      - name: Read each image
        run: |
          mkdir -p scan-reports
          failed=0
          for name in server converter edge web; do
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$PWD:/work" --workdir /work \
              "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --ignorefile /work/.trivyignore \
              --format json --output "/work/scan-reports/$name.json" \
              "repomemo-$name:scan" || failed=1
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$PWD:/work" --workdir /work \
              "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /work/.trivyignore \
              --format table --output "/work/scan-reports/$name.txt" \
              "repomemo-$name:scan" || true
          done
          exit "$failed"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: image-scan-reports
          path: scan-reports
          if-no-files-found: warn

  # The web client on its own (V0.4.15): the image runs without the API, read-only and with every capability dropped,
  # and serves the app with the right headers, the single-page fallback, the runtime configuration and its health route.
  web-image:
    name: Web image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the web image
        run: docker build --target webapp --tag repomemo-web:ci .
      - name: Start it alone
        run: |
          docker run --detach --name web-ci --publish 127.0.0.1:8080:8080 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env REPOMEMO_WEB_API_URL=https://api.example.com --env "REPOMEMO_PRODUCT_NAME=Acme Memo" repomemo-web:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs web-ci >&2
          exit 1
      - name: The app, the fallback and the headers
        run: |
          curl --fail --silent --dump-header page.headers --output page.html http://127.0.0.1:8080/
          grep -qi '<div id="root">' page.html
          grep -qi '^cache-control: no-cache' page.headers
          grep -qi "^content-security-policy: .*connect-src 'self' https://api.example.com[ ;]" page.headers
          ! grep -qi 'http-equiv="Content-Security-Policy"' page.html
          grep -qi '^x-content-type-options: nosniff' page.headers
          grep -qi '^x-frame-options: DENY' page.headers
          ! grep -qi '^server: ' page.headers
          curl --fail --silent http://127.0.0.1:8080/workspaces/anything/here | grep -qi '<div id="root">'
      - name: Hashed files are cached for a year
        run: |
          asset=$(grep -o '/assets/[^"]*\.js' page.html | head -1)
          test -n "$asset"
          curl --fail --silent --dump-header asset.headers --output /dev/null "http://127.0.0.1:8080$asset"
          grep -qi '^cache-control: public, max-age=31536000, immutable' asset.headers
      - name: It tells the app its server and name from the environment
        run: |
          test "$(curl --fail --silent http://127.0.0.1:8080/config.json)" = '{"apiUrl":"https://api.example.com","productName":"Acme Memo"}'
      - name: Compression
        run: curl --fail --silent --header 'Accept-Encoding: gzip' --dump-header gz.headers --output /dev/null http://127.0.0.1:8080/ && grep -qi '^content-encoding: ' gz.headers
      - name: What the web image logged
        if: failure()
        run: docker logs web-ci
      - name: Clean up
        if: always()
        run: docker rm --force web-ci || true

  # The two images together, with nothing between them (V0.4.16): the web image forwards /v1 and /health to the API, so
  # one address serves the app and the API.
  same-origin:
    name: Web and API, same origin
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build both images
        run: |
          docker build --target server --tag repomemo-server:ci .
          docker build --target webapp --tag repomemo-web:ci .
      - name: Start the API and the web image on one network
        run: |
          docker network create repomemo-ci
          docker run --detach --name api --network repomemo-ci --env REPOMEMO_SERVER_ADDR=0.0.0.0:3020 --env REPOMEMO_SERVER_DATA_DIR=main \
            --env REPOMEMO_ALLOW_INSECURE_HTTP=true --env REPOMEMO_ALLOWED_ORIGIN=http://127.0.0.1:8080 \
            --env "REPOMEMO_JWT_SECRET=$(openssl rand -hex 32)" --env "REPOMEMO_SECRET_KEY=$(openssl rand -hex 32)" repomemo-server:ci
          docker run --detach --name web --network repomemo-ci --publish 127.0.0.1:8080:8080 --read-only --tmpfs /tmp --cap-drop ALL \
            --env REPOMEMO_API_UPSTREAM=api:3020 repomemo-web:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs api >&2
          docker logs web >&2
          exit 1
      - name: The app, the API and its refusals through the web image alone
        run: |
          test "$(curl --fail --silent http://127.0.0.1:8080/health/ready)" = '{"status":"ready","database":"ok"}'
          curl --fail --silent http://127.0.0.1:8080/health | grep -q '"status":"ok"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/v1/workspaces)" = "401"
          curl --fail --silent http://127.0.0.1:8080/ | grep -qi '<div id="root">'
      - name: What both logged
        if: failure()
        run: |
          docker logs api
          docker logs web
      - name: Clean up
        if: always()
        run: |
          docker rm --force api web || true
          docker network rm repomemo-ci || true

  # The web app on one address and the API on another (V0.4.17): the server runs with the web app's origin allowed
  # and a cookie that may cross sites; the requests a browser makes from the web origin and from a third one are made
  # by script, and the third is refused.
  cross-origin:
    name: Two origins
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build the API image
        run: docker build --target server --tag repomemo-server:ci .
      - name: Start the API with another address for the web app
        run: |
          docker run --detach --name api --publish 127.0.0.1:3020:3020 --env REPOMEMO_SERVER_ADDR=0.0.0.0:3020 --env REPOMEMO_SERVER_DATA_DIR=main \
            --env REPOMEMO_ALLOW_INSECURE_HTTP=true --env REPOMEMO_ALLOWED_ORIGIN=http://app.localtest.me:8080 --env REPOMEMO_COOKIE_SAMESITE=lax \
            --env "REPOMEMO_JWT_SECRET=$(openssl rand -hex 32)" --env "REPOMEMO_SECRET_KEY=$(openssl rand -hex 32)" repomemo-server:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3020/health/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs api >&2
          exit 1
      - name: Sign in, refresh and stream from the web origin, and be refused from a third
        run: node scripts/cross-origin-test.mjs http://127.0.0.1:3020 http://app.localtest.me:8080 http://evil.localtest.me
      - name: What the API logged
        if: failure()
        run: docker logs api
      - name: Clean up
        if: always()
        run: docker rm --force api || true

  # The converter image on its own (V0.4.12): built and tagged without the rest, it must run as the unprivileged
  # user, listen on its socket with no network and a read-only root, and say which LibreOffice it carries.
  converter-image:
    name: Converter image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the converter image
        run: docker build --target converter --tag repomemo-converter:ci .
      - name: It runs as the unprivileged user and starts the listener
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' repomemo-converter:ci)" = "repomemo"
          docker image inspect --format '{{json .Config.Entrypoint}}' repomemo-converter:ci | grep -q repomemo-soffice-listener
      - name: It listens on its socket with no network and a read-only root
        run: |
          docker run --detach --name converter-ci --network none --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --volume converter-ci-socket:/run/soffice repomemo-converter:ci
          for attempt in $(seq 1 30); do
            if docker exec converter-ci test -S /run/soffice/convert.sock; then exit 0; fi
            sleep 1
          done
          docker logs converter-ci >&2
          echo "the converter never opened its socket" >&2
          exit 1
      - name: Which LibreOffice it carries
        run: |
          version=$(docker run --rm --network none --entrypoint soffice repomemo-converter:ci --headless --version || true)
          echo "The converter image carries: $version" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Clean up
        if: always()
        run: |
          docker rm --force converter-ci || true
          docker volume rm converter-ci-socket || true

  # The server as a release archive (V0.4.31): the web app and the server are built, packed by scripts/package-server.mjs,
  # and the archive is unpacked in a clean folder, checked against its own checksums and started: it serves the app.
  server-archive:
    name: Server archive (linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The packager's own tests
        run: npm run package:test
      - name: Build the web app (for the page's own host) and the server
        run: |
          npm ci
          VITE_REPOMEMO_API_URL="" npm run build
          cargo build --release --locked -p repomemo-server
      - name: Pack it
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" node scripts/package-server.mjs --binary target/release/repomemo-server --web apps/desktop/dist --os linux --arch x64 --out dist-server
      - name: Unpack in a clean folder and check the checksums
        run: |
          mkdir "$RUNNER_TEMP/clean"
          tar -xzf dist-server/repomemo-server-*-linux-x64.tar.gz -C "$RUNNER_TEMP/clean"
          cd "$RUNNER_TEMP/clean"/repomemo-server-*-linux-x64
          sha256sum --check SHA256SUMS
          (cd "$GITHUB_WORKSPACE/dist-server" && sha256sum --check SHA256SUMS)
      - name: Start it and ask for the app
        run: |
          home="$(echo "$RUNNER_TEMP"/clean/repomemo-server-*-linux-x64)"
          mkdir "$RUNNER_TEMP/work"
          cd "$RUNNER_TEMP/work"
          REPOMEMO_JWT_SECRET="$(openssl rand -hex 32)" REPOMEMO_SECRET_KEY="$(openssl rand -hex 32)" \
            REPOMEMO_SERVER_DATA_DIR=main REPOMEMO_WEB_DIR="$home/web" REPOMEMO_SERVER_ADDR=127.0.0.1:3020 \
            "$home/bin/repomemo-server" > server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3020/health/ready > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3020/ | grep -qi '<div id="root">'
          curl --fail --silent http://127.0.0.1:3020/config.json | grep -q '"apiUrl":""'
          curl --fail --silent http://127.0.0.1:3020/health | grep -q '"status":"ok"'
      - name: Stop it, then install the archive as a systemd service (V0.4.32)
        run: |
          pkill -x repomemo-server || true
          home="$(echo "$RUNNER_TEMP"/clean/repomemo-server-*-linux-x64)"
          sudo sh "$home/service/install.sh" --generate-secrets --start
          sudo systemd-analyze verify /etc/systemd/system/repomemo.service
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3020/health/ready > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3020/ | grep -qi '<div id="root">'
          systemctl is-active repomemo
          sudo systemd-analyze security repomemo.service --no-pager | tail -3 || true
          test "$(id -un repomemo)" = "repomemo"
          test "$(sudo stat -c %a /etc/repomemo/repomemo.env)" = "600"
          ps -o user= -C repomemo-server | grep -qx repomemo
      - name: A second run changes nothing
        run: |
          home="$(echo "$RUNNER_TEMP"/clean/repomemo-server-*-linux-x64)"
          before="$(sudo sha256sum /etc/repomemo/repomemo.env /etc/systemd/system/repomemo.service | sha256sum; readlink /opt/repomemo)"
          sudo sh "$home/service/install.sh"
          after="$(sudo sha256sum /etc/repomemo/repomemo.env /etc/systemd/system/repomemo.service | sha256sum; readlink /opt/repomemo)"
          test "$before" = "$after"
          systemctl is-active repomemo
      - name: It stops cleanly
        run: |
          sudo systemctl stop repomemo
          ! systemctl is-failed --quiet repomemo
          sudo journalctl -u repomemo --no-pager | tail -5
      - name: What it logged
        if: failure()
        run: |
          cat "$RUNNER_TEMP/work/server.log" || true
          sudo journalctl -u repomemo --no-pager | tail -60 || true
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: server-archive-linux-x64
          path: dist-server
          if-no-files-found: error

  # Windows: the server as a service (V0.4.33). The archive for Windows is built and packed, installed with the script, and
  # the service must be registered to start at boot, answer, stop cleanly and be removed.
  server-archive-windows:
    name: Server archive (windows x64) and service
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the web app (for the page's own host) and the server
        shell: bash
        run: |
          npm ci
          VITE_REPOMEMO_API_URL="" npm run build
          cargo build --release --locked -p repomemo-server
      - name: Pack it
        shell: bash
        run: node scripts/package-server.mjs --binary target/release/repomemo-server.exe --web apps/desktop/dist --os windows --arch x64 --out dist-server
      - name: Unpack it
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-ChildItem dist-server\repomemo-server-*-windows-x64.zip).FullName -DestinationPath "$env:RUNNER_TEMP\clean"
          $root = (Get-ChildItem "$env:RUNNER_TEMP\clean" -Directory).FullName
          "ARCHIVE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install it as a service and start it
        shell: pwsh
        run: |
          & "$env:ARCHIVE_ROOT\service\install.ps1" -GenerateSecrets -Start
          $service = Get-Service RepoMemo
          if ($service.Status -ne "Running") { throw "the service is $($service.Status)" }
          if ($service.StartType -ne "Automatic") { throw "the service does not start at boot: $($service.StartType)" }
      - name: It answers, and serves the app
        shell: pwsh
        run: |
          $ready = $false
          for ($attempt = 0; $attempt -lt 60 -and -not $ready; $attempt++) {
            try { $ready = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3020/health/ready).StatusCode -eq 200 } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) { throw "/health/ready never answered" }
          if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3020/).Content -notmatch '<div id="root">') { throw "the app is not served" }
      - name: A second run of the installer changes nothing
        shell: pwsh
        run: |
          $before = (Get-FileHash "$env:ProgramData\RepoMemo\repomemo.env").Hash + (Get-Item "$env:ProgramFiles\RepoMemo\current").Target
          & "$env:ARCHIVE_ROOT\service\install.ps1"
          $after = (Get-FileHash "$env:ProgramData\RepoMemo\repomemo.env").Hash + (Get-Item "$env:ProgramFiles\RepoMemo\current").Target
          if ($before -ne $after) { throw "the second run changed the settings or the link" }
          if ((Get-Service RepoMemo).Status -ne "Running") { throw "the service stopped" }
      - name: It stops cleanly
        shell: pwsh
        run: |
          Stop-Service RepoMemo
          (Get-Service RepoMemo).WaitForStatus("Stopped", [TimeSpan]::FromSeconds(60))
          $log = Get-ChildItem "$env:ProgramData\RepoMemo\workspace-data\main\logs" -Filter *.jsonl -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Get-Content $log.FullName -Tail 3 }
      - name: It is removed, and the data stays
        shell: pwsh
        run: |
          & "$env:ARCHIVE_ROOT\service\uninstall.ps1"
          if (Get-Service RepoMemo -ErrorAction SilentlyContinue) { throw "the service is still registered" }
          if (-not (Test-Path "$env:ProgramData\RepoMemo\repomemo.env")) { throw "the settings were removed" }
      - name: What it logged
        if: failure()
        shell: pwsh
        run: |
          Get-Service RepoMemo -ErrorAction SilentlyContinue | Format-List
          Get-ChildItem "$env:ProgramData\RepoMemo" -Recurse -Filter *.jsonl -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 }
          Get-WinEvent -FilterHashtable @{ LogName = "System"; ProviderName = "Service Control Manager" } -MaxEvents 8 -ErrorAction SilentlyContinue | Format-List TimeCreated, Message
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: server-archive-windows-x64
          path: dist-server
          if-no-files-found: error

  # The front doors for direct installs (V0.4.34): the Caddyfile is validated by Caddy and the nginx file by nginx, both pinned.
  direct-front-doors:
    name: Front doors for direct installs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Caddy accepts the Caddyfile
        run: |
          docker run --rm --volume "$PWD/deploy/direct/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: nginx accepts the configuration
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=memo.example.com" -keyout certs/privkey.pem -out certs/fullchain.pem
          docker run --rm --volume "$PWD/deploy/direct/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            --volume "$PWD/certs:/etc/letsencrypt/live/memo.example.com:ro" \
            nginx:1.31.7-alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d nginx -t

  # The monitoring example (V0.4.30): Prometheus scrapes the server's metrics with a system-scope token and shows its figures.
  monitoring:
    name: Prometheus example
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: A new stack without the monitoring profile
        run: |
          sh deploy/init.sh --no-edge
          echo "REPOMEMO_SETUP_CODE=METRICSTEST2345" >> .env
          docker compose up --build --detach --wait --wait-timeout 900 server web
          test -z "$(docker compose ps --services | grep -x prometheus || true)"
      - name: An administrator and a token of the system scope
        run: |
          session=$(curl --fail --silent --request POST --header 'content-type: application/json' \
            --data '{"code":"METRICSTEST2345","email":"metrics@example.com","display_name":"Metrics","password":"a-long-enough-password-1"}' \
            http://127.0.0.1:8080/v1/setup/admin)
          access=$(echo "$session" | sed -E 's/.*"access_token":"([^"]+)".*/\1/')
          created=$(curl --fail --silent --request POST --header "authorization: Bearer $access" --header 'content-type: application/json' \
            --data '{"name":"prometheus","scope":"system","expires_in_days":1}' http://127.0.0.1:8080/v1/profile/tokens)
          echo "$created" | sed -E 's/.*"secret":"([^"]+)".*/\1/' | tr -d '\n' > deploy/monitoring/metrics-token
          test -s deploy/monitoring/metrics-token
      - name: Start Prometheus with the profile
        run: docker compose --profile monitoring up --detach --wait --wait-timeout 300 prometheus
      - name: It shows the server's figures
        run: |
          for attempt in $(seq 1 40); do
            answer=$(curl --silent 'http://127.0.0.1:9090/api/v1/query?query=repomemo_users')
            if echo "$answer" | grep -q '"result":\[{'; then echo "$answer"; exit 0; fi
            sleep 3
          done
          curl --silent 'http://127.0.0.1:9090/api/v1/targets' >&2 || true
          echo "Prometheus never showed repomemo_users" >&2
          exit 1
      - name: What the stack logged
        if: failure()
        run: docker compose --profile monitoring logs --no-color --tail 100
      - name: Clean up
        if: always()
        run: docker compose --profile monitoring down --volumes || true

  # The data of the previous release survives this one (V0.4.27): the previous release (deploy/upgrade-from.txt) is built and
  # run on a single volume, makes an administrator, a workspace and an indexed note; its volume is moved into the three of
  # this release (V0.4.22), the compose stack starts on them, and the same administrator signs in, finds the workspace and
  # the note, reads its file back and finds its text by search. A migration that loses data fails the job.
  upgrade-from-previous:
    name: Upgrade from the previous release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Which release is the previous one
        run: echo "PREVIOUS_SHA=$(grep -v '^#' deploy/upgrade-from.txt | awk 'NR==1 {print $1}')" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.PREVIOUS_SHA }}
          path: previous
      - name: Build the previous release's server image
        run: docker build --target server --tag repomemo-server:previous previous
      - name: Secrets, shared by both releases
        run: |
          {
            echo "REPOMEMO_JWT_SECRET=$(openssl rand -hex 32)"
            echo "REPOMEMO_SECRET_KEY=$(openssl rand -hex 32)"
            echo "REPOMEMO_SETUP_CODE=UPGRADETEST2345"
          } > .env
      - name: The previous release makes its data on a single volume
        run: |
          set -a; . ./.env; set +a
          docker volume create repomemo_repomemo-data
          docker run --detach --name previous --publish 127.0.0.1:3020:3020 --volume repomemo_repomemo-data:/var/lib/repomemo \
            --env REPOMEMO_SERVER_ADDR=0.0.0.0:3020 --env REPOMEMO_SERVER_DATA_DIR=main --env REPOMEMO_ALLOW_INSECURE_HTTP=true \
            --env REPOMEMO_JWT_SECRET --env REPOMEMO_SECRET_KEY --env REPOMEMO_SETUP_CODE repomemo-server:previous
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3020/health/ready > /dev/null; then break; fi
            sleep 2
          done
          node scripts/upgrade-test.mjs seed http://127.0.0.1:3020 "$REPOMEMO_SETUP_CODE" "$RUNNER_TEMP/state.json"
          docker stop previous
          docker rm previous
      - name: Move its volume into the three of this release and start this release
        run: |
          sh deploy/migrate-volumes.sh repomemo
          docker compose up --build --detach --wait --wait-timeout 900
      - name: Nothing was lost
        run: node scripts/upgrade-test.mjs verify http://127.0.0.1:8080 "$RUNNER_TEMP/state.json"
      - name: What the stack logged
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Clean up
        if: always()
        run: docker compose down --volumes || true

  # Backups and restores in containers (V0.4.25): a stack makes data, its volumes are copied with the stack stopped, the
  # copy is restored into the volumes of a second stack, and the second stack has the data.
  volume-restore:
    name: Restore into a second stack
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: A first stack with an account
        run: |
          sh deploy/init.sh --no-edge
          docker compose --project-name repomemo-a up --build --detach --wait --wait-timeout 900
          curl --fail --silent --output /dev/null --request POST --header 'content-type: application/json' \
            --data '{"email":"restored@example.com","display_name":"Restored","password":"a-long-enough-password-1"}' http://127.0.0.1:8080/v1/auth/register
      - name: Copy its volumes off (the stack is stopped for the database and the files, then started again)
        run: |
          sh deploy/backup-volumes.sh --project repomemo-a --out "$RUNNER_TEMP/copies" --all
          test -f "$RUNNER_TEMP/copies/backup.txt"
          curl --fail --silent http://127.0.0.1:8080/health/ready
      - name: A second copy into the same folder is refused
        run: if sh deploy/backup-volumes.sh --project repomemo-a --out "$RUNNER_TEMP/copies" --all; then echo "it should have refused" >&2; exit 1; fi
      - name: Stop the first stack and restore into a second
        run: |
          docker compose --project-name repomemo-a down
          sh deploy/restore-volumes.sh --from "$RUNNER_TEMP/copies" --project repomemo-b
          docker compose --project-name repomemo-b up --build --detach --wait --wait-timeout 900
      - name: The second stack has the account
        run: |
          curl --fail --silent --output /dev/null --request POST --header 'content-type: application/json' \
            --data '{"email":"restored@example.com","password":"a-long-enough-password-1"}' http://127.0.0.1:8080/v1/auth/login
      - name: A restore over a filled volume is refused
        run: |
          docker compose --project-name repomemo-b down
          if sh deploy/restore-volumes.sh --from "$RUNNER_TEMP/copies" --project repomemo-b; then echo "it should have refused" >&2; exit 1; fi
      - name: What the stacks logged
        if: failure()
        run: |
          docker compose --project-name repomemo-a logs --no-color --tail 100 || true
          docker compose --project-name repomemo-b logs --no-color --tail 100 || true
      - name: Clean up
        if: always()
        run: |
          docker compose --project-name repomemo-a down --volumes || true
          docker compose --project-name repomemo-b down --volumes || true

  # The compose file on its own runs released images (V0.4.40): no build, the registry's names and the tag of the release, and
  # the build file is what adds a build. Nothing is started or pulled here.
  compose-released-images:
    name: Compose runs released images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: docker-compose.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: sh deploy/init.sh --no-edge
      - name: The compose file names the released images and builds nothing
        run: REPOMEMO_VERSION=9.9.9 docker compose --profile previews --profile edge config --format json | node scripts/check-compose-images.mjs released 9.9.9 ghcr.io/repomemo
      - name: Another registry is one setting
        run: REPOMEMO_VERSION=9.9.9 REPOMEMO_REGISTRY=registry.example.com/acme docker compose --profile previews --profile edge config --format json | node scripts/check-compose-images.mjs released 9.9.9 registry.example.com/acme
      - name: The build file is what adds a build
        run: REPOMEMO_VERSION=9.9.9 docker compose -f docker-compose.yml -f docker-compose.build.yml --profile previews --profile edge config --format json | node scripts/check-compose-images.mjs built 9.9.9

  # The quick start (V0.4.41): the container files of a release are packed, fetched by the script with their checksum, the init
  # makes a .env, and the stack they describe is the released one. A download that does not match its checksum unpacks nothing.
  quickstart:
    name: Quick start
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: docker-compose.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: A release page with the container files and their sums
        run: |
          mkdir -p "$RUNNER_TEMP/site/v9.9.9"
          sh deploy/package-compose.sh 9.9.9 "$RUNNER_TEMP/site/v9.9.9"
          (cd "$RUNNER_TEMP/site/v9.9.9" && sha256sum repomemo-compose-9.9.9.tar.gz > SHA256SUMS)
          sh deploy/package-compose.sh 9.9.9 "$RUNNER_TEMP/again"
          cmp "$RUNNER_TEMP/again/repomemo-compose-9.9.9.tar.gz" "$RUNNER_TEMP/site/v9.9.9/repomemo-compose-9.9.9.tar.gz"
      - name: Fetch, check and unpack
        run: |
          sh deploy/quickstart.sh --version 9.9.9 --base-url "file://$RUNNER_TEMP/site" --dir "$RUNNER_TEMP/repomemo"
          test -f "$RUNNER_TEMP/repomemo/docker-compose.yml"
          grep -q '^REPOMEMO_VERSION=9.9.9$' "$RUNNER_TEMP/repomemo/.env.example"
      - name: The init makes a .env, and the stack is the released one
        working-directory: ${{ runner.temp }}/repomemo
        run: |
          sh deploy/init.sh --no-edge
          grep -q '^REPOMEMO_VERSION=9.9.9$' .env
          docker compose --profile previews --profile edge config --format json | node "$GITHUB_WORKSPACE/scripts/check-compose-images.mjs" released 9.9.9 ghcr.io/repomemo
      - name: A download that does not match its sums unpacks nothing
        run: |
          echo tampered > "$RUNNER_TEMP/site/v9.9.9/repomemo-compose-9.9.9.tar.gz"
          if sh deploy/quickstart.sh --version 9.9.9 --base-url "file://$RUNNER_TEMP/site" --dir "$RUNNER_TEMP/refused"; then echo "it should have refused" >&2; exit 1; fi
          test ! -e "$RUNNER_TEMP/refused"

  # The upgrade script (V0.4.24): a good tag is run, a broken one ends on the old version, running.
  upgrade-script:
    name: Upgrade script
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: An install on version ci1
        run: |
          sh deploy/init.sh --no-edge
          echo "REPOMEMO_VERSION=ci1" >> .env
          docker compose up --build --detach --wait --wait-timeout 900
          curl --fail --silent http://127.0.0.1:8080/health | grep -q '"image":"ci1"'
      - name: A tag that does not exist ends on the old version, running
        run: |
          if sh deploy/upgrade.sh --version broken --no-build --no-backup --timeout 120; then echo "the broken tag should have failed" >&2; exit 1; fi
          grep -q '^REPOMEMO_VERSION=ci1$' .env
          curl --fail --silent http://127.0.0.1:8080/health | grep -q '"image":"ci1"'
      - name: A good tag is run
        run: |
          sh deploy/upgrade.sh --version ci2 --no-backup
          grep -q '^REPOMEMO_VERSION=ci2$' .env
          curl --fail --silent http://127.0.0.1:8080/health | grep -q '"image":"ci2"'
      - name: Without a token or --no-backup it stops before touching anything
        run: |
          if sh deploy/upgrade.sh --version ci3; then echo "it should have asked for a backup" >&2; exit 1; fi
          grep -q '^REPOMEMO_VERSION=ci2$' .env
      - name: What the stack logged
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # The script that makes a .env (V0.4.23), in shell and in PowerShell: strong secrets, the host name, the edge profile, and it
  # refuses to overwrite a file. The result must be a file Docker Compose accepts.
  init-scripts:
    name: Init scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The shell script makes a .env
        run: |
          sh deploy/init.sh --host memo.example.com --output sh.env
          grep -q '^REPOMEMO_HOST=memo.example.com$' sh.env
          grep -q '^COMPOSE_PROFILES=edge$' sh.env
          grep -Eq '^REPOMEMO_JWT_SECRET=[0-9a-f]{64}$' sh.env
          grep -Eq '^REPOMEMO_SECRET_KEY=[0-9a-f]{64}$' sh.env
          test "$(stat -c %a sh.env)" = "600"
          docker compose --env-file sh.env config --quiet
      - name: It refuses to overwrite, and says why
        run: |
          if sh deploy/init.sh --output sh.env; then echo "the second run should have been refused" >&2; exit 1; fi
      - name: Two runs do not share secrets
        run: |
          sh deploy/init.sh --no-edge --output other.env
          test "$(grep '^REPOMEMO_JWT_SECRET=' sh.env)" != "$(grep '^REPOMEMO_JWT_SECRET=' other.env)"
          grep -q '^COMPOSE_PROFILES=$' other.env
      - name: The PowerShell script makes the same
        shell: pwsh
        run: |
          ./deploy/init.ps1 -HostName memo.example.com -Output ps.env
          if (-not (Select-String -Path ps.env -Pattern '^REPOMEMO_JWT_SECRET=[0-9a-f]{64}$' -Quiet)) { throw "no strong JWT secret" }
          if (-not (Select-String -Path ps.env -Pattern '^COMPOSE_PROFILES=edge$' -Quiet)) { throw "no edge profile" }
          $failed = $false
          try { ./deploy/init.ps1 -Output ps.env } catch { $failed = $true }
          if (-not $failed) { throw "the second run should have been refused" }
      - name: The PowerShell file is one Docker Compose accepts
        run: docker compose --env-file ps.env config --quiet

  # A 0.3.x layout is moved into the three volumes (V0.4.22): the server runs once on the single volume the way 0.3.x
  # ran it and an account is made; the stack is stopped, deploy/migrate-volumes.sh moves the data, the compose stack starts
  # on the new volumes and the same account signs in. (V0.4.27 repeats this with the real 0.3.27 images.)
  volume-migration:
    name: Move the single volume into three
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: A .env with throwaway secrets
        run: |
          {
            echo "REPOMEMO_JWT_SECRET=$(openssl rand -hex 32)"
            echo "REPOMEMO_SECRET_KEY=$(openssl rand -hex 32)"
          } > .env
      - name: Build the server image
        run: docker build --target server --tag repomemo-server:migrate .
      - name: Run it on one volume, the old way, and make an account
        run: |
          set -a; . ./.env; set +a
          docker volume create repomemo_repomemo-data
          docker run --detach --name old --publish 127.0.0.1:3020:3020 --volume repomemo_repomemo-data:/var/lib/repomemo \
            --env REPOMEMO_SERVER_ADDR=0.0.0.0:3020 --env REPOMEMO_SERVER_DATA_DIR=main --env REPOMEMO_ALLOW_INSECURE_HTTP=true \
            --env REPOMEMO_JWT_SECRET --env REPOMEMO_SECRET_KEY repomemo-server:migrate
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3020/health/ready > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --output /dev/null --request POST --header 'content-type: application/json' \
            --data '{"email":"moved@example.com","display_name":"Moved","password":"a-long-enough-password-1"}' http://127.0.0.1:3020/v1/auth/register
          docker stop old
          docker rm old
      - name: Move the data
        run: sh deploy/migrate-volumes.sh repomemo
      - name: Start the stack on the new volumes
        run: docker compose up --build --detach --wait --wait-timeout 900
      - name: The same account signs in, and the data is in the new volumes
        run: |
          curl --fail --silent --output /dev/null --request POST --header 'content-type: application/json' \
            --data '{"email":"moved@example.com","password":"a-long-enough-password-1"}' http://127.0.0.1:8080/v1/auth/login
          docker run --rm --volume repomemo_repomemo-db:/db:ro alpine test -f /db/repomemo.sqlite
      - name: A second run refuses to mix
        run: |
          docker compose down
          if sh deploy/migrate-volumes.sh repomemo; then echo "the second run should have been refused" >&2; exit 1; fi
      - name: What the stack logged
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Clean up
        if: always()
        run: docker compose down --volumes || true

  # The stack without the edge, behind a proxy of one's own (V0.4.18): with no profile, the server and the web image run,
  # and the web image answers the app and the API on its loopback port, in plain HTTP.
  compose-no-edge:
    name: docker compose without the edge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: A .env with throwaway secrets and no profile
        run: |
          {
            echo "REPOMEMO_JWT_SECRET=$(openssl rand -hex 32)"
            echo "REPOMEMO_SECRET_KEY=$(openssl rand -hex 32)"
          } > .env
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 900
      - name: The web image answers the app and the API in plain HTTP
        run: |
          curl --fail --silent http://127.0.0.1:8080/health/ready
          curl --fail --silent http://127.0.0.1:8080/ | grep -qi '<div id="root">'
      - name: No edge runs
        run: test -z "$(docker compose ps --services | grep -x edge || true)"
      - name: What the stack logged
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # The edge with certificates of the operator's own (V0.4.18): the certificate in deploy/certs is the one served.
  edge-certificates:
    name: Edge with supplied certificates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: A certificate of our own for localhost
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=localhost/O=Supplied Certificate Test" \
            -addext "subjectAltName=DNS:localhost" -keyout deploy/certs/tls.key -out deploy/certs/tls.crt
      - name: A .env with throwaway secrets
        run: |
          {
            echo "REPOMEMO_HOST=localhost"
            echo "COMPOSE_PROFILES=edge"
            echo "REPOMEMO_JWT_SECRET=$(openssl rand -hex 32)"
            echo "REPOMEMO_SECRET_KEY=$(openssl rand -hex 32)"
          } > .env
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 900
      - name: The edge serves our certificate
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --insecure --resolve localhost:443:127.0.0.1 https://localhost/health/ready; then break; fi
            sleep 3
          done
          echo | openssl s_client -connect 127.0.0.1:443 -servername localhost 2>/dev/null | openssl x509 -noout -subject | tee subject.txt
          grep -q "Supplied Certificate Test" subject.txt
      - name: What the stack logged
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # The API on its own (V0.4.11): deploy/api.yml starts the server and its volume with no web client and no proxy,
  # and it must turn healthy and answer `/health/ready` on its published port.
  api-only:
    name: API alone
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: A .env with throwaway secrets
        run: |
          {
            echo "REPOMEMO_JWT_SECRET=$(openssl rand -hex 32)"
            echo "REPOMEMO_SECRET_KEY=$(openssl rand -hex 32)"
          } > .env
      - name: Build and start the API
        run: docker compose -f deploy/api.yml --env-file .env up --build --detach --wait --wait-timeout 900
      - name: The API answers ready on its own port
        run: curl --fail --silent --show-error http://127.0.0.1:3020/health/ready
      - name: Nothing else runs
        run: test "$(docker compose -f deploy/api.yml --env-file .env ps --services | tr '\n' ' ')" = "server "
      - name: What the API logged
        if: failure()
        run: docker compose -f deploy/api.yml --env-file .env logs --no-color --tail 200
      - name: Stop the API
        if: always()
        run: docker compose -f deploy/api.yml --env-file .env down --volumes

  # The server image builds its dependencies in a layer of their own (V0.4.7). The image is built twice on a
  # clean runner: once whole, then after a change of code only. The second build must reuse the layer of
  # dependencies and take well under the first; both times are written to the job's summary.
  server-image-cache:
    name: Server image cache
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the server image whole
        run: |
          start=$(date +%s)
          docker build --target server --tag repomemo-server:cache-first .
          echo "FIRST=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Change the code and build it again
        run: |
          echo "// a change of code that no dependency sees" >> apps/server/src/main.rs
          start=$(date +%s)
          docker build --target server --tag repomemo-server:cache-second .
          echo "SECOND=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: The second build reused the dependencies
        run: |
          echo "Whole build: ${FIRST}s. After a change of code: ${SECOND}s." | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(( SECOND * 10 ))" -lt "$(( FIRST * 6 ))" || { echo "the rebuild took more than 60% of the whole build" >&2; exit 1; }

  # The images for arm64 (roadmap O7b, V0.3.23): built natively on an arm64 runner, so nothing is emulated, and
  # looked at once: the server's binary and git are arm64 builds. Nothing is pushed anywhere.
  images-arm64:
    name: Images for arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the server image
        run: docker build --platform linux/arm64 --target server --tag repomemo-server:arm64 .
      - name: Build the web image
        run: docker build --platform linux/arm64 --target webapp --tag repomemo-web:arm64 .
      - name: Build the edge image
        run: docker build --platform linux/arm64 --target edge --tag repomemo-edge:arm64 .
      - name: Both images are arm64 ones, and the server image has its git
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' repomemo-server:arm64)" = "arm64"
          test "$(docker image inspect --format '{{.Architecture}}' repomemo-web:arm64)" = "arm64"
          test "$(docker image inspect --format '{{.Architecture}}' repomemo-edge:arm64)" = "arm64"
          docker run --rm --entrypoint git repomemo-server:arm64 --version

  # An environment folder made by 0.2.0 (its schema, rows and files) is opened by the current code and
  # migrated in place with its data intact (roadmap R9). The same test also runs in the job below; it has
  # its own job so a failure says what broke.
  upgrade:
    name: Upgrade from 0.2.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Released migrations are unchanged
        run: node scripts/check-migrations.mjs
      - name: A 0.2.0 environment upgrades in place
        run: cargo test -p repomemo-storage --locked an_environment_made_by_v0_2_0_upgrades_in_place_and_keeps_its_data

  rust-tests:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --exclude repomemo-desktop --locked

  rust-advisories:
    name: Rust advisories (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --exclude repomemo-desktop
          command: check advisories sources

  rust-lint:
    name: rustfmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        if: success() || failure()
        run: cargo clippy --workspace --exclude repomemo-desktop --all-targets --locked -- -D warnings

  rust-policy:
    name: Licenses, bans and advisories (whole workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses advisories
