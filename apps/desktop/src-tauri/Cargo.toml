[package]
name = "repomemo-desktop"
version.workspace = true
description = "RepoMemo desktop app"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "repomemo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-http.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-window-state.workspace = true
url.workspace = true

# The session of a server connection is kept in the operating system's credential store (V0.2.49).
[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }

[build-dependencies]
tauri-build.workspace = true
