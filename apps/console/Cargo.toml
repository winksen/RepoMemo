[package]
name = "repomemo-console"
version.workspace = true
description = "The RepoMemo admin console in a terminal"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "repomemo-console"
path = "src/main.rs"

[dependencies]
repomemo-domain.workspace = true
reqwest.workspace = true
rpassword = "7"
rustyline = "14"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
# Turns on colour (virtual terminal) processing in older Windows consoles.
nu-ansi-term = "0.50"
