# cargo-deny policy, run in CI (.github/workflows/ci.yml, roadmap C8).

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# Unmaintained crates are reported for our direct dependencies only; the ones
# deep in third-party trees are not ours to replace.
unmaintained = "workspace"
# An ignored advisory needs a reason and a date to revisit it.
ignore = [
  # Marvin attack on RSA decryption. `rsa` arrives through jsonwebtoken, which
  # RepoMemo uses for HS256 only (HMAC): no RSA key is ever loaded, nothing is
  # decrypted, and there is no fixed release. Revisit by 2027-01-15, or once
  # jsonwebtoken lets the RSA backend be left out.
  { id = "RUSTSEC-2023-0071", reason = "rsa is linked by jsonwebtoken but never used: tokens are HS256" },
  # Timing variability in constant-time integer operations of crypto-bigint 0.5.5, which arrives through
  # jsonwebtoken's elliptic-curve backends (p256, p384, ecdsa). RepoMemo signs with HS256 only: no elliptic-curve
  # key is ever loaded and none of those operations runs on a secret. The fix (0.7.6) is a different major
  # version that elliptic-curve 0.13 cannot use. Revisit by 2027-01-15, or once jsonwebtoken moves to a
  # release built on crypto-bigint 0.7 or lets those backends be left out.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint is linked by jsonwebtoken's EC backends but never used: tokens are HS256" },
  # zip 4.6.1 arrives through tauri-plugin-updater (V0.4.56). Its extraction keeps SUID/SGID bits (0367) and follows symbolic
  # links out of the folder (0368). The updater extracts only an archive whose signature it has already checked against the
  # public key of the maintainer or of the administrator's own feed, as the person who runs the app (never as root), so an
  # attacker would need the signing key first. Approved by the maintainer on 2026-10-26. Revisit by 2027-01-15, or once
  # tauri-plugin-updater uses zip 9.
  { id = "RUSTSEC-2026-0367", reason = "zip extracts only archives the updater has verified against a signing key, as the person, not root" },
  { id = "RUSTSEC-2026-0368", reason = "zip extracts only archives the updater has verified against a signing key" },
  { id = "RUSTSEC-2026-0369", reason = "the same zip extraction, applying permissions through symbolic links; same reasoning" },
]

[bans]
# A second version of a crate costs build time but is not a defect: reqwest 0.13
# arrives through Tauri, next to the version the server uses.
multiple-versions = "warn"
wildcards = "allow"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "Unlicense",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
