[workspace]
members = [
  "crates/domain",
  "crates/ingestion",
  "crates/indexer",
  "crates/retrieval",
  "crates/ai",
  "crates/storage",
  "crates/api",
  "apps/desktop/src-tauri"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/repomemo/repomemo"
rust-version = "1.78"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "chrono", "json", "uuid"] }
tree-sitter = "0.25"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }

repomemo-api = { path = "crates/api" }
repomemo-ai = { path = "crates/ai" }
repomemo-domain = { path = "crates/domain" }
repomemo-ingestion = { path = "crates/ingestion" }
repomemo-indexer = { path = "crates/indexer" }
repomemo-retrieval = { path = "crates/retrieval" }
repomemo-storage = { path = "crates/storage" }
