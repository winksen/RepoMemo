# RepoMemo behind nginx (V0.4.19): a sample front door for the web image, which serves the app and the API on one
# address (docker compose without the `edge` profile publishes it on 127.0.0.1:8080).
#
# Set on the server (in .env or the environment of the API):
#   REPOMEMO_PUBLIC_URL=https://memo.example.com
#   REPOMEMO_ALLOWED_ORIGIN=https://memo.example.com
#   REPOMEMO_TRUST_PROXY=true
#   REPOMEMO_TRUSTED_PROXIES=<the address nginx connects from, when it is not on the same machine>
# nginx sets X-Forwarded-For to the client's address alone ($remote_addr): it does not append what the client sent.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name memo.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name memo.example.com;

    ssl_certificate     /etc/letsencrypt/live/memo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memo.example.com/privkey.pem;

    # Uploads and archives can be large; the server enforces its own limits (REPOMEMO_MAX_UPLOAD_MB).
    client_max_body_size 1g;
    proxy_request_buffering off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # The live event streams: no buffering, no cache, an hour before nginx gives up on a quiet stream, so events
    # arrive as they happen.
    location ~ ^/v1/(workspaces/[^/]+/events|system/events)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
