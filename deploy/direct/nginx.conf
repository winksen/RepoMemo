# nginx in front of a direct install (V0.4.34): put this file in /etc/nginx/conf.d/repomemo.conf. The server on
# 127.0.0.1:3020 serves the web app itself (REPOMEMO_WEB_DIR), so one proxy rule is enough. Get the certificate first:
#   sudo certbot certonly --nginx -d memo.example.com
#
# On the server (/etc/repomemo/repomemo.env): REPOMEMO_PUBLIC_URL=https://memo.example.com, REPOMEMO_ALLOWED_ORIGIN the same,
# REPOMEMO_TRUST_PROXY=true (nginx is on loopback, which the server already believes).
server {
    listen 80;
    server_name memo.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name memo.example.com;

    ssl_certificate     /etc/letsencrypt/live/memo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memo.example.com/privkey.pem;

    client_max_body_size 1g;
    proxy_request_buffering off;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Live event streams: no buffering, an hour before nginx gives up on a quiet one.
    location ~ ^/v1/(workspaces/[^/]+/events|system/events)$ {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
